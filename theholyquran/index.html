:root{--green:#0f4f45;--gold:#a8823f;--paper:#fbf6e8;--pink:#17150f;--bg:#e4dfd0;--a:1;--pw:360px;
--ui:"Noto Naskh Arabic","Geeza Pro","Segoe UI",Tahoma,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:var(--ui);color:#17150f;overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
#bar{flex:none;height:48px;display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--green);color:#f4ecd6}
#bar button{background:none;border:0;color:inherit;padding:8px 10px;border-radius:8px;font-size:15px}
#bar button:active,#bar button:focus-visible{background:#ffffff26;outline:none}
#ttl{flex:1;text-align:center;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pager{flex:1;min-height:0;display:flex;direction:rtl;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#pager.h{flex-direction:row;scroll-snap-type:x mandatory}
#pager.v{flex-direction:column;overflow-x:hidden}
.slide{flex:none;display:flex;flex-direction:column;align-items:center;padding:10px 8px 24px}
.h .slide{width:100%;height:100%;overflow-y:auto;scroll-snap-align:center;scroll-snap-stop:always}
.v .slide{width:100%;height:calc(var(--pw)*1.6 + 34px)}
.page{flex:none;width:var(--pw);height:calc(var(--pw)*1.6);margin:auto;position:relative;color:var(--pink);
background:var(--paper);box-shadow:0 1px 10px #0003;padding:calc(var(--pw)*.07) calc(var(--pw)*.05) calc(var(--pw)*.06);
display:flex;flex-direction:column;border:1px solid #0002}
.ph,.pf{position:absolute;left:calc(var(--pw)*.05);right:calc(var(--pw)*.05);display:flex;justify-content:space-between;font-size:calc(var(--pw)*.032);opacity:.6}
.ph{top:calc(var(--pw)*.02)}.pf{bottom:calc(var(--pw)*.016);justify-content:center}
.lines{flex:1;display:flex;flex-direction:column;justify-content:space-between;opacity:var(--a)}
.lines.few{justify-content:space-evenly}
.ln{flex:none;height:calc(var(--pw)*.098);display:flex;justify-content:center;align-items:center;direction:rtl;white-space:nowrap;line-height:1}
.w{display:inline-block;cursor:pointer;border-radius:.12em;transform:translateY(.13em)}
.w.sel{background:#0f4f452e}.w.play{background:#a8823f44}
.ln.hd{height:calc(var(--pw)*.095);border:1.5px solid var(--gold);outline:1px solid var(--gold);outline-offset:calc(var(--pw)*-.008);background:#a8823f22;border-radius:calc(var(--pw)*.012);margin:calc(var(--pw)*.006) 0}
.ln.hd .w{transform:none;cursor:default}
.sheet{position:fixed;inset:0;z-index:5;display:none;background:#0006}.sheet.on{display:block}
.card{position:absolute;bottom:0;left:0;right:0;max-height:84%;overflow:auto;background:#fffdf6;border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));max-width:660px;margin:0 auto}
.card h3{margin:0 0 10px;font-size:17px;color:var(--green)}
.tabs,.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button,.seg button{flex:1;min-width:64px;padding:9px 6px;border:1px solid #cfc6a8;background:#f4eedb;border-radius:10px;font-size:14px}
.tabs .on,.seg .on{background:var(--green);color:#fff;border-color:var(--green)}
.row{display:flex;align-items:center;gap:10px;padding:11px 8px;border:0;border-bottom:1px solid #ece5cf;width:100%;background:none;text-align:right;font-size:16px}
.row b{flex:none;width:30px;color:var(--gold)}.row span{flex:1}.row i{font-style:normal;color:#7b7255;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.grid button{padding:10px 0;border:1px solid #cfc6a8;background:#f7f1de;border-radius:10px;font-size:15px}.grid .cur{background:var(--green);color:#fff}
label.f{display:block;margin:12px 0 5px;font-size:14px}
input[type=range]{width:100%;accent-color:var(--green)}
input[type=number],select,input[type=text]{padding:8px;border:1px solid #cfc6a8;border-radius:8px;background:#fff;font-size:14px}
input[type=number]{width:70px;text-align:center}
input[type=color]{width:42px;height:34px;padding:0;border:1px solid #cfc6a8;border-radius:8px;background:#fff;vertical-align:middle}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.act button,.btn{flex:1;min-width:110px;padding:10px;border-radius:10px;border:0;background:var(--green);color:#fff;font-size:14px}
.alt{background:#efe7cf!important;color:#17150f!important}
.note{font-size:12.5px;color:#7b7255;margin:6px 0 0}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw button{width:36px;height:36px;border-radius:50%;border:2px solid #cfc6a8}.sw button.on{border-color:var(--green);box-shadow:0 0 0 2px #fff inset}
.pl{display:flex;align-items:center;gap:8px}.pl button{width:44px;height:44px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:18px}
.pl .s{width:36px;height:36px;background:#efe7cf;color:#17150f}.pl b{flex:1;font-size:15px}
/* studio */
#studio{position:fixed;inset:0;z-index:9;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}#studio.on{display:flex}
#stb{flex:none;height:44px;display:flex;align-items:center;padding:0 10px;background:var(--green);color:#f4ecd6;gap:8px}
#stb button{background:none;border:0;color:inherit;font-size:15px;padding:8px}#stb b{flex:1;text-align:center;font-weight:500}
#pvw{flex:1 1 40%;min-height:150px;display:flex;align-items:center;justify-content:center;padding:8px;background:repeating-conic-gradient(#c9c3b1 0 25%,#d8d3c3 0 50%) 0 0/16px 16px}
#pv{max-width:100%;max-height:100%;box-shadow:0 2px 12px #0004;touch-action:none;cursor:grab}
#pnl{flex:none;height:52%;overflow:auto;background:#fffdf6;border-radius:16px 16px 0 0;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
.tp{display:none}.tp.on{display:block}
.two{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.two label{font-size:14px}
#chips{display:flex;flex-wrap:wrap;gap:4px;max-height:140px;overflow:auto;padding:6px;background:#f4eedb;border-radius:10px;direction:rtl}
.chip{padding:3px 7px;background:#fff;border:1px solid #cfc6a8;border-radius:7px;font-size:16px;cursor:pointer}.chip.br{background:#dcebe0;margin-inline-end:100%}
#gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}#gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
#dim{position:fixed;inset:0;z-index:99;background:#000;pointer-events:none;opacity:0}
.lines{filter:brightness(var(--fb,1))}
#as{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:4;display:none;align-items:center;gap:6px;background:#0f4f45ee;color:#f4ecd6;border-radius:26px;padding:6px 10px;box-shadow:0 2px 12px #0005}
#as.on{display:flex}#as button{background:none;border:0;color:inherit;font-size:18px;width:36px;height:36px;border-radius:50%}#as button:active{background:#ffffff30}#as b{min-width:34px;text-align:center;font-size:14px}
html.night{--bg:#0a0b0d}html.night #bar,html.night #stb{background:#10231e}html.night #pv{box-shadow:none}
html.night .card,html.night #pnl{background:#1a1c1f;color:#e6dfc8}html.night .card h3{color:#9fd3c4}
html.night .tabs button,html.night .seg button,html.night .grid button{background:#25282c;border-color:#3a3e44;color:#e6dfc8}
html.night .tabs .on,html.night .seg .on,html.night .grid .cur{background:#1f6b5d;color:#fff}
html.night input[type=number],html.night select,html.night input[type=text]{background:#25282c;border-color:#3a3e44;color:#e6dfc8}
html.night .alt{background:#2c3035!important;color:#e6dfc8!important}html.night .row{border-color:#2c3035}html.night .note,html.night .row i{color:#9a9482}
#print{display:none}
@media print{#dim,#as{display:none!important}#print .page{--paper:#fff;--pink:#000}#print .lines{filter:none}@page{size:A4 portrait;margin:8mm}
html,body{height:auto;overflow:visible;background:#fff}
body>*:not(#print){display:none!important}#print{display:block}
#print .page{--pw:172mm;box-shadow:none;border:0;margin:0 auto;break-after:page;page-break-after:always}
#print .page:last-child{break-after:auto;page-break-after:auto}#print .w.sel,#print .w.play{background:none}}
</style>
</head>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const JUZ=[1,22,42,62,82,102,121,142,162,182,201,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582],MAXP=604;
const PAL=[['#fbf6e8','#17150f'],['#ffffff','#111111'],['#f1e4c3','#2b2112'],['#e9e9e6','#1a1a1a'],['#e3efe1','#10281f'],['#16181b','#e9e2cc']];
const REC=[['حفص عن عاصم',[['الحصري — مرتل','Husary_128kbps'],['الحصري — مجوّد','Husary_Mujawwad_128kbps'],['مشاري العفاسي','Alafasy_128kbps'],['عبد الباسط — مرتل','Abdul_Basit_Murattal_64kbps'],['عبد الباسط — مجوّد','Abdul_Basit_Mujawwad_128kbps'],['المنشاوي — مرتل','Minshawy_Murattal_128kbps'],['المنشاوي — مجوّد','Minshawy_Mujawwad_192kbps'],['السديس','Abdurrahmaan_As-Sudais_192kbps'],['الشريم','Saood_ash-Shuraym_128kbps'],['أبو بكر الشاطري','Abu_Bakr_Ash-Shaatree_128kbps'],['هاني الرفاعي','Hani_Rifai_192kbps'],['ماهر المعيقلي','MaherAlMuaiqly128kbps'],['الحذيفي','Hudhaify_128kbps'],['الغامدي','Ghamadi_40kbps'],['ياسر الدوسري','Yasser_Ad-Dussary_128kbps'],['محمد الطبلاوي','Mohammad_al_Tablaway_128kbps']]],['ورش عن نافع',[['إبراهيم الدوسري','warsh/warsh_ibrahim_aldosary_128kbps'],['ياسين الجزائري','warsh/warsh_yassin_al_jazaery_64kbps']]]];
const st=Object.assign({p:1,a:100,m:'h',bg:PAL[0],rec:'Husary_128kbps',mode:'once',n:1,rs:null,re:null,tap:1,night:0,br:100,fb:100,sp:20},(()=>{try{return JSON.parse(localStorage.getItem('mushaf2')||'{}')}catch(e){return{}}})());
const save=()=>{try{localStorage.setItem('mushaf2',JSON.stringify(st))}catch(e){}};
const juzOf=p=>JUZ.filter(s=>p>=s).length;
const CNT={},ORDER=[],IDX={},PAGEOF={},WU={};
SURAHS.forEach(s=>{CNT[s.id]=s.c;for(let a=1;a<=s.c;a++){const k=s.id+':'+a;IDX[k]=ORDER.length;ORDER.push(k)}});
for(let p=1;p<=MAXP;p++)for(const L of DATA[p].l)if(L.t=='t')for(const w of L.w){if(w[2]==2)continue;const k=w[1];if(!(k in PAGEOF))PAGEOF[k]=p;const u=WU[k]=WU[k]||[];if(w[2]==0)u.push({c:w[0],f:L.f,t:w[3]});else if(u.length)u[u.length-1].c+=w[0]}
const verseText=k=>WU[k].map(u=>u.t).join(' ')+' \u06DD'+ar(k.split(':')[1]);
const sName=id=>SURAHS[id-1].n;

/* لون الصفحة */
function applyBg(){const r=document.documentElement.style,n=st.night;r.setProperty('--paper',n?'#14161a':st.bg[0]);r.setProperty('--pink',n?'#d8cfb3':st.bg[1]);
 document.documentElement.classList.toggle('night',!!n);r.setProperty('--fb',st.fb/100);$('#dim').style.opacity=(1-st.br/100)*.88;
 $('#brV').textContent=ar(st.br)+'٪';$('#fbV').textContent=ar(st.fb)+'٪';$('#spV').textContent=ar(st.sp);$('#night').checked=!!n;$('#brR').value=st.br;$('#fbR').value=st.fb;$('#spR').value=st.sp;$('#asV').textContent=ar(st.sp);
 document.querySelector('meta[name=theme-color]').content=n?'#10231e':'#0f4f45'}
function lum(h){const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255))/255}
function buildSw(){const s=$('#sw');s.innerHTML='';PAL.forEach(p=>{const b=document.createElement('button');b.style.background=p[0];b.title=p[1];b.className=st.bg[0]==p[0]?'on':'';b.onclick=()=>{st.bg=p;applyBg();save();buildSw()};s.appendChild(b)});
 const c=document.createElement('input');c.type='color';c.value=st.bg[0];c.oninput=()=>{st.bg=[c.value,lum(c.value)<.45?'#f1ead6':'#17150f'];applyBg();save();$$('#sw button').forEach(x=>x.className='')};s.appendChild(c)}

/* الصفحات */
function pageEl(n){
 const d=DATA[n],el=document.createElement('div');el.className='page';el.dataset.p=n;
 let h='<div class="ph"><span>الجزء '+ar(juzOf(n))+'</span><span>سورة '+sName(d.s)+'</span></div><div class="lines'+(d.l.length<15?' few':'')+'">';
 for(const L of d.l){
  if(L.t=='h')h+='<div class="ln hd"><span class="w" style="font-family:F0;font-size:calc(var(--pw)*.0694)">'+L.c+'</span></div>';
  else if(L.t=='b')h+='<div class="ln"><span class="w" style="font-family:F'+L.f+';font-size:calc(var(--pw)*.0559)">'+L.c+'</span></div>';
  else{const R=L.e>=14.5?(.9/L.e):.0559;
   h+='<div class="ln" style="font-size:calc(var(--pw)*'+R.toFixed(5)+');font-family:F'+L.f+'">'+L.w.map(w=>'<span class="w"'+(w[2]==2?'':' data-k="'+w[1]+'"')+'>'+w[0]+'</span>').join('')+'</div>'}}
 el.innerHTML=h+'</div><div class="pf">'+ar(n)+'</div>';
 markPlay(el);return el}
const pager=$('#pager');let rio,cio,lock=false,ratios={};
function build(){
 pager.className=st.m;pager.innerHTML='';ratios={};
 for(let n=1;n<=MAXP;n++){const s=document.createElement('section');s.className='slide';s.dataset.p=n;pager.appendChild(s)}
 rio&&rio.disconnect();cio&&cio.disconnect();
 rio=new IntersectionObserver(es=>es.forEach(e=>{const s=e.target;if(e.isIntersecting){if(!s.firstChild)s.appendChild(pageEl(+s.dataset.p))}else s.textContent=''}),{root:pager,rootMargin:st.m=='h'?'0px 200% 0px 200%':'200% 0px 200% 0px'});
 cio=new IntersectionObserver(es=>{es.forEach(e=>{ratios[e.target.dataset.p]=e.intersectionRatio});if(lock)return;let b=0,bp=st.p;for(const p in ratios)if(ratios[p]>b){b=ratios[p];bp=+p}if(b>0)setPage(bp)},{root:pager,threshold:[0,.2,.4,.6,.8,1]});
 $$('.slide').forEach(s=>{rio.observe(s);cio.observe(s)});size()}
let baseH=0,lastW=0;
function size(){
 const W=innerWidth;if(W!=lastW||innerHeight>baseH){baseH=innerHeight;lastW=W}
 let pw=Math.min(pager.clientWidth-16,780);
 if(W<=baseH)pw=Math.min(pw,(baseH-48-20)/1.6); /* الارتفاع لا يتغير مع لوحة المفاتيح */
 document.documentElement.style.setProperty('--pw',Math.max(240,pw)+'px');go(st.p,false)}
function go(n,smooth){n=Math.max(1,Math.min(MAXP,n|0||1));lock=true;const s=pager.querySelector('.slide[data-p="'+n+'"]');
 if(s)s.scrollIntoView({behavior:smooth?'smooth':'instant',block:'start',inline:'center'});setPage(n,true);setTimeout(()=>{lock=false},smooth?700:150)}
function setPage(n,f){if(n==st.p&&!f)return;st.p=n;save();title()}
function title(){$('#ttl').textContent='صفحة '+ar(st.p)+' · الجزء '+ar(juzOf(st.p))+' · '+sName(DATA[st.p].s)}
function flash(t){$('#ttl').textContent=t;setTimeout(title,1800)}

/* الفهرس */
let tab='s';
function idx(){const b=$('#idxBody');$$('#sIdx .tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t==tab));let h='';
 if(tab=='s')for(const s of SURAHS)h+='<button class="row" data-g="'+s.p+'"><b>'+ar(s.id)+'</b><span>'+s.n+'</span><i>'+ar(s.c)+' آية · ص '+ar(s.p)+'</i></button>';
 if(tab=='j')JUZ.forEach((p,i)=>{h+='<button class="row" data-g="'+p+'"><b>'+ar(i+1)+'</b><span>الجزء '+ar(i+1)+'</span><i>ص '+ar(p)+'</i></button>'});
 if(tab=='p'){h='<div class="grid">';for(let p=1;p<=MAXP;p++)h+='<button data-g="'+p+'"'+(p==st.p?' class="cur"':'')+'>'+ar(p)+'</button>';h+='</div>'}
 b.innerHTML=h;const c=b.querySelector('.cur');c&&c.scrollIntoView({block:'center'})}
const open=id=>$(id).classList.add('on'),shut=id=>$(id).classList.remove('on');
$('#bIdx').onclick=()=>{idx();open('#sIdx')};
$$('#sIdx .tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;idx()});
$('#idxBody').onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;shut('#sIdx');go(+b.dataset.g,false)};
$$('.sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s&&s.id!='vbar')s.classList.remove('on')}));

/* العرض */
function ui(){document.documentElement.style.setProperty('--a',st.a/100);$('#aVal').textContent=ar(st.a)+'٪';$('#aRng').value=st.a;$('#mH').classList.toggle('on',st.m=='h');$('#mV').classList.toggle('on',st.m=='v');$('#tapP').checked=!!st.tap}
$('#bSet').onclick=()=>{$('#pFrom').value=$('#pTo').value=st.p;$('#pFrom').max=$('#pTo').max=MAXP;buildSw();open('#sSet')};
$('#aRng').oninput=e=>{st.a=+e.target.value;ui();save()};
$('#mH').onclick=()=>{st.m='h';ui();build()};$('#mV').onclick=()=>{st.m='v';ui();build()};
$('#tapP').onchange=e=>{st.tap=e.target.checked?1:0;save()};
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement,de=document.documentElement;
if(!(de.requestFullscreen||de.webkitRequestFullscreen))$('#bFs').style.display='none';
$('#bFs').onclick=()=>{fsEl()?(document.exitFullscreen||document.webkitExitFullscreen).call(document):(de.requestFullscreen||de.webkitRequestFullscreen).call(de)};
['fullscreenchange','webkitfullscreenchange'].forEach(e=>document.addEventListener(e,()=>setTimeout(size,150)));
$('#bPrint').onclick=async()=>{let a=Math.max(1,Math.min(MAXP,+$('#pFrom').value||st.p)),b=Math.max(1,Math.min(MAXP,+$('#pTo').value||a));if(b<a)[a,b]=[b,a];
 const P=$('#print');P.innerHTML='';for(let n=a;n<=b;n++)P.appendChild(pageEl(n));shut('#sSet');P.offsetHeight;
 await document.fonts.ready;setTimeout(()=>window.print(),400)};
addEventListener('afterprint',()=>{$('#print').innerHTML=''});
$('#bOff').onclick=async()=>{const m=$('#offMsg');if(!('serviceWorker' in navigator)||!/^https?:/.test(location.protocol)){m.textContent='الوضع الأوفلاين الكامل يحتاج فتح التطبيق من عنوان http(s) (انظر ملف README).';return}
 const c=await caches.keys();const n=c.length?(await (await caches.open(c[0])).keys()).length:0;m.textContent='ملفات محفوظة للأوفلاين: '+ar(n)+' من '+ar(50)+(n>=50?' — التطبيق يعمل بدون إنترنت.':' — استمر بالتصفح ليكتمل.')};

/* الصوت */
const au=new Audio();au.preload='auto';let pl=null;
const recSel=$('#rec');REC.forEach(g=>{const o=document.createElement('optgroup');o.label=g[0];g[1].forEach(r=>{const x=document.createElement('option');x.value=r[1];x.textContent=r[0];o.appendChild(x)});recSel.appendChild(o)});
recSel.value=st.rec;recSel.onchange=()=>{st.rec=recSel.value;save();if(pl)playAt()};
const aUrl=k=>{const[s,a]=k.split(':');return 'https://everyayah.com/data/'+st.rec+'/'+String(s).padStart(3,'0')+String(a).padStart(3,'0')+'.mp3'};
let cur=null;
function modesUi(){$$('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.v==st.mode));$('#rN').value=st.n;
 $('#rgTx').textContent=st.rs?('المقطع: '+ar(st.rs.replace(':','/'))+' ← '+ar((st.re||st.rs).replace(':','/'))):'المقطع غير محدد'}
$('#modes').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.mode=b.dataset.v;save();modesUi()};
$('#rN').onchange=e=>{st.n=Math.max(0,Math.min(99,+e.target.value||0));save()};
$('#setS').onclick=()=>{st.rs=cur;if(!st.re||IDX[st.re]<IDX[cur])st.re=cur;save();modesUi()};
$('#setE').onclick=()=>{st.re=cur;if(!st.rs||IDX[st.rs]>IDX[cur])st.rs=cur;save();modesUi()};
function startPlay(k){const m=st.mode,s=+k.split(':')[0];let list,i=0,loops=1;
 if(m=='once')list=[k];else if(m=='cont'){list=ORDER.slice(IDX[k],IDX[s+':'+CNT[s]]+1)}
 else if(m=='v'){list=[k];loops=st.n}
 else if(m=='s'){list=ORDER.slice(IDX[s+':1'],IDX[s+':'+CNT[s]]+1);i=IDX[k]-IDX[s+':1'];loops=st.n}
 else{if(!st.rs){st.rs=st.re=k}list=ORDER.slice(IDX[st.rs],IDX[st.re]+1);loops=st.n}
 pl={list,i,loops,loop:0,first:true};playAt()}
function playAt(){if(!pl)return;const k=pl.list[pl.i];au.src=aUrl(k);au.play().catch(()=>{});pl.k=k;markPlay();
 if(PAGEOF[k]!=st.p&&!pl.first)go(PAGEOF[k],true);pl.first=false;$('#aPlay').textContent='⏸';
 const nx=pl.list[pl.i+1];if(nx){const pre=new Audio();pre.preload='auto';pre.src=aUrl(nx)}}
au.onended=()=>{if(!pl)return;pl.i++;if(pl.i>=pl.list.length){pl.loop++;if(pl.loops&&pl.loop>=pl.loops){stopPlay();return}pl.i=0}playAt()};
au.onerror=()=>{if(pl){stopPlay();flash('تعذّر تحميل الصوت — تحقق من الاتصال أو غيّر القارئ')}};
function stopPlay(){au.pause();pl=null;$('#aPlay').textContent='▶';markPlay()}
function markPlay(root){const k=pl&&pl.k;(root?[root]:[document]).forEach(r=>r.querySelectorAll('.w.play').forEach(x=>x.classList.remove('play')));if(k)(root?root:document).querySelectorAll('.w[data-k="'+k+'"]').forEach(x=>x.classList.add('play'))}
$('#aPlay').onclick=()=>{if(pl&&!au.paused){au.pause();$('#aPlay').textContent='▶'}else if(pl){au.play();$('#aPlay').textContent='⏸'}else startPlay(cur)};
const step=d=>{const j=IDX[cur]+d;if(j<0||j>=ORDER.length)return;pick(ORDER[j]);if(PAGEOF[cur]!=st.p)go(PAGEOF[cur],true);startPlay(cur)};
$('#aPrev').onclick=()=>step(-1);$('#aNext').onclick=()=>step(1);

/* تحديد الآية */
function pick(k){$$('.w.sel').forEach(x=>x.classList.remove('sel'));cur=k;
 if(!k){shut('#vbar');return}
 $$('.w[data-k="'+k+'"]').forEach(x=>x.classList.add('sel'));
 const[s,a]=k.split(':');$('#vTtl').textContent=sName(s)+' — الآية '+ar(a);modesUi();open('#vbar')}
pager.addEventListener('click',e=>{const w=e.target.closest('.w[data-k]');if(!w)return;const k=w.dataset.k;pick(k);if(st.tap)startPlay(k)});
$('#vX').onclick=()=>{stopPlay();pick(null)};
$('#vTxt').onclick=async()=>{const t=verseText(cur);try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}flash('تم نسخ النص')};
async function fontsFor(us){await Promise.all([...new Set([0,...us.map(u=>u.f)])].map(f=>document.fonts.load('40px F'+f,'\uF100')))}
/* رسم النص على canvas */
const cw=(ctx,u,fs)=>{ctx.font=fs+'px F'+u.f;return[...u.c].map(ch=>ctx.measureText(ch).width)};
function lay(ctx,units,fs,maxW,brk){const gap=fs*.14,L=[];let cr=[],w=0;
 for(const u of units){const ws=cw(ctx,u,fs),uw=ws.reduce((a,b)=>a+b,0);
  if(cr.length&&w+gap+uw>maxW){L.push({c:cr,w});cr=[];w=0}
  w+=(cr.length?gap:0)+uw;cr.push({u,ws,uw});if(brk&&brk[u.i]){L.push({c:cr,w});cr=[];w=0}}
 if(cr.length)L.push({c:cr,w});return L}
function paint(ctx,L,fs,left,right,cy,al,ls){const rh=fs*ls,gap=fs*.14,top=cy-L.length*rh/2;ctx.textAlign='left';ctx.textBaseline='alphabetic';
 L.forEach((ln,i)=>{let xr=al=='r'?right:al=='l'?left+ln.w:(left+right)/2+ln.w/2;const by=top+i*rh+rh*.68;
