name: Deploy Quran app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'theholyquran/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Include custom domain
        run: cp CNAME theholyquran/CNAME
      - name: Upload Quran app as site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./theholyquran
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
